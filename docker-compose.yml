version: '3.8'

services:
  mongodb:
    image: mongo:7.0-alpine
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/railmadad?authSource=admin
      MONGO_URI: mongodb://admin:password@mongodb:27017/railmadad?authSource=admin
      JWT_SECRET: dev_secret_key_change_in_prod
      JWT_EXPIRE: 7d
      ADMIN_EMAIL: admin@railmadad.local
      ADMIN_PASSWORD: Admin@123
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '80:80'
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongodb_data:
  redis_data:
