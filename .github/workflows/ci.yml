name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run backend tests
        run: cd backend && npm test

      - name: Check backend security vulnerabilities
        run: cd backend && npm audit --audit-level=moderate
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Check frontend security vulnerabilities
        run: cd frontend && npm audit --audit-level=moderate
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ matrix.node-version }}
          path: frontend/dist/
          retention-days: 1

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: railmadad-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: false
          tags: railmadad-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Check for TODO comments
        run: |
          echo "Checking for unresolved TODO items..."
          grep -r "TODO:" backend/server.js backend/config/ backend/controllers/ backend/middleware/ || echo "No critical TODOs found"
          grep -r "TODO:" frontend/src/ || echo "No critical TODOs found"

      - name: Lint frontend code
        run: cd frontend && npm run lint
        continue-on-error: true

      - name: Check frontend formatting
        run: cd frontend && npm run format:check
        continue-on-error: true

      - name: Verify .gitignore coverage
        run: |
          echo "Checking .gitignore files..."
          for gitignore in .gitignore backend/.gitignore frontend/.gitignore; do
            if [ -f "$gitignore" ]; then
              echo "✓ $gitignore exists"
            else
              echo "✗ Missing $gitignore"
            fi
          done
