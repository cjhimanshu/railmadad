name: Node.js CI - Backend Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm run install-backend

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            mongosh --eval "db.adminCommand({ ping: 1 })" && break || sleep 1
          done

      - name: Run backend tests
        run: npm run test-backend
        env:
          MONGODB_URI: mongodb://localhost:27017/railmadad_test
